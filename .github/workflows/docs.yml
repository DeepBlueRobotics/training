name: Deploy Docs

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mkdocs mkdocs-material mdx_math

      - run: mkdocs build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.sha }}
          path: site/

      - run: mkdocs gh-deploy --force
